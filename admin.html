<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#111;
            color:white;
            padding:30px;
        }

        h1{
            text-align:center;
           
        }
        
        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        th,td{
            border:1px solid #444;
            padding:12px;
            text-align:left;
        }

        th{
            background:#00bcd4;
            color:white;
        }

        tr:nth-child(even){
            background:#222;
        }
    </style>
</head>

<body>

<h1>Portfolio Messages</h1>

<button onclick="logout()">Logout</button>
<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Message</th>

<th>Date</th>

<th>Action</th>

</tr>

</thead>

<tbody id="messageTable">

</tbody>

</table>

<script src="admin.js"></script>

</body>
</html>
