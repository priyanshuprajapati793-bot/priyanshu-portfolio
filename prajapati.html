<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priyanshu Prajapati | AI &amp; ML Engineer</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #050816;
      --surface: #0d1530;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, rgba(34, 211, 238, 0.15), transparent 35%),
        var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    main {
      width: min(760px, 100%);
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid rgba(34, 211, 238, 0.25);
      border-radius: 24px;
      background: rgba(13, 21, 48, 0.82);
      box-shadow: 0 0 70px rgba(34, 211, 238, 0.12);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 0.95;
    }

    h1 span {
      color: var(--accent);
    }

    p {
      max-width: 580px;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .skills span {
      padding: 8px 12px;
      border: 1px solid rgba(34, 211, 238, 0.3);
      border-radius: 999px;
      color: var(--text);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">AI &amp; ML Engineer</p>
    <h1>Priyanshu <span>Prajapati</span></h1>
    <p>
      I build intelligent, practical products with machine learning,
      modern web technologies, and thoughtful user experiences.
    </p>
    <div class="skills" aria-label="Skills">
      <span>Machine Learning</span>
      <span>Artificial Intelligence</span>
      <span>Web Development</span>
    </div>
  </main>
</body>
</html>
